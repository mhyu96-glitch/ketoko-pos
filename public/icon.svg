<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="coffee-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#96633b" />
      <stop offset="100%" stop-color="#633e26" />
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#coffee-grad)" />
  <!-- Inner Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#f5ebe0" stroke-width="8" opacity="0.2" />
  <!-- Shopping Cart Icon -->
  <path d="M120 140 H160 L200 320 H380 L420 180 H180" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Cart Wheels -->
  <circle cx="220" cy="380" r="28" fill="url(#amber-grad)" stroke="#ffffff" stroke-width="8" />
  <circle cx="360" cy="380" r="28" fill="url(#amber-grad)" stroke="#ffffff" stroke-width="8" />
  <!-- Cashier Spark / Receipt Mini -->
  <rect x="230" y="190" width="80" height="100" rx="10" fill="#ffffff" opacity="0.95" />
  <line x1="245" y1="215" x2="295" y2="215" stroke="#96633b" stroke-width="8" stroke-linecap="round" />
  <line x1="245" y1="240" x2="295" y2="240" stroke="#96633b" stroke-width="8" stroke-linecap="round" />
  <line x1="245" y1="265" x2="275" y2="265" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
</svg>

